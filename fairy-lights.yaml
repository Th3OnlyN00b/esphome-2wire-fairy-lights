# =============================================================================
# ESPHome controller for two-wire (anti-parallel) fairy lights, replacing the
# stock 8-mode controller box. Full build guide: README.md
# https://github.com/Th3OnlyN00b/esphome-2wire-fairy-lights
#
# The string's LEDs alternate polarity, so current one way lights set A and
# the other way lights set B. The hbridge light flips direction every loop
# so both sets can appear lit at once.
#
# Hardware:
#   - Seeed XIAO ESP32-C3 (attach the u.FL antenna -- Wi-Fi is poor without)
#   - DRV8871 H-bridge breakout (45V rated; a ~29V string needs it --
#     DRV8833 / TB6612 / L9110S are only rated 10-15V)
#   - Pololu D36V6F5 buck (fixed 5V, 50V max input). Generic "5-30V"
#     bucks are too close to a 29V supply.
#   - 10-47uF / 50V+ electrolytic across the 29V input (plug-in spikes)
#
# Wiring:
#   29V supply +   -> DRV8871 VM  and D36V6F5 VIN  and cap +
#   29V supply -   -> DRV8871 GND and D36V6F5 GND  and cap -
#   D36V6F5 VOUT   -> XIAO 5V
#   D36V6F5 GND    -> XIAO GND    (common ground with the DRV8871)
#   XIAO D2 (GPIO4) -> DRV8871 IN1
#   XIAO D3 (GPIO5) -> DRV8871 IN2
#   DRV8871 OUT1/OUT2 -> the two string wires (polarity just picks which
#                        set is "A")
#
# Never plug USB into the XIAO while the 29V side is powered: the XIAO has
# no diode between USB 5V and its 5V pin. Update over Wi-Fi.
# D0/D8/D9 (GPIO2/8/9) are boot-strapping pins -- don't use them here.
#
# In HA the light shows a colour-temperature slider: cool end = set A,
# warm end = set B, middle = both.
#
# Effects all follow two HA sliders: Speed (1.0x = the default timing
# noted on each effect) and Fade Depth (100% = fades go fully dark).
# Each effect keeps its own phase, advanced by elapsed time x speed, so
# changing Speed mid-effect never makes it jump. A gap > 500ms between
# runs means the effect was just (re)started, so the clock resyncs.
# =============================================================================

substitutions:
  device_name: fairy-lights           # hostname; keep it <= 23 chars
  friendly_name: Fairy Lights         # light.fairy_lights in Home Assistant
  pin_a: GPIO4   # XIAO D2
  pin_b: GPIO5   # XIAO D3

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_name}-fallback   # Wi-Fi SSIDs max out at 32 chars
    password: !secret fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

output:
  # ~19.5kHz keeps the PWM above hearing range (no coil/LED whine).
  - platform: ledc
    id: out_a
    pin: ${pin_a}
    frequency: 19531Hz
  - platform: ledc
    id: out_b
    pin: ${pin_b}
    frequency: 19531Hz

light:
  - platform: hbridge
    id: fairy
    name: None          # inherits friendly_name -> light.fairy_lights
    pin_a: out_a
    pin_b: out_b
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 500ms
    effects:
      # A and B swap with a hard cut. 0.5s per set.
      - lambda:
          name: Alternate
          update_interval: 20ms
          lambda: |-
            static float p = 0; static uint32_t last = 0;
            uint32_t now = millis(); if (now - last > 500) last = now;
            float sp = id(fx_speed).state; if (std::isnan(sp) || sp < 0.1f) sp = 1.0f;
            p = fmodf(p + (now - last) * sp / 500.0f, 2.0f); last = now;
            float a = p < 1.0f ? 1.0f : 0.0f;
            auto call = id(fairy).turn_on();
            call.set_cold_white(a); call.set_warm_white(1.0f - a);
            call.set_transition_length(0); call.set_publish(false); call.set_save(false);
            call.perform();

      # Whole string on/off. 0.5s on, 0.5s off.
      - lambda:
          name: Blink
          update_interval: 20ms
          lambda: |-
            static float p = 0; static uint32_t last = 0;
            uint32_t now = millis(); if (now - last > 500) last = now;
            float sp = id(fx_speed).state; if (std::isnan(sp) || sp < 0.1f) sp = 1.0f;
            p = fmodf(p + (now - last) * sp / 500.0f, 2.0f); last = now;
            float v = p < 1.0f ? 1.0f : 0.0f;
            auto call = id(fairy).turn_on();
            call.set_cold_white(v); call.set_warm_white(v);
            call.set_transition_length(0); call.set_publish(false); call.set_save(false);
            call.perform();

      # A -> both -> B -> off, like the stock controller. 0.4s per step.
      - lambda:
          name: Sequential
          update_interval: 20ms
          lambda: |-
            static float p = 0; static uint32_t last = 0;
            uint32_t now = millis(); if (now - last > 500) last = now;
            float sp = id(fx_speed).state; if (std::isnan(sp) || sp < 0.1f) sp = 1.0f;
            p = fmodf(p + (now - last) * sp / 400.0f, 4.0f); last = now;
            int step = (int) p;
            float a = (step == 0 || step == 1) ? 1.0f : 0.0f;
            float b = (step == 1 || step == 2) ? 1.0f : 0.0f;
            auto call = id(fairy).turn_on();
            call.set_cold_white(a); call.set_warm_white(b);
            call.set_transition_length(0); call.set_publish(false); call.set_save(false);
            call.perform();

      # A flashes twice, then B flashes twice. 1s per set.
      - lambda:
          name: Double Flash
          update_interval: 20ms
          lambda: |-
            static float p = 0; static uint32_t last = 0;
            uint32_t now = millis(); if (now - last > 500) last = now;
            float sp = id(fx_speed).state; if (std::isnan(sp) || sp < 0.1f) sp = 1.0f;
            p = fmodf(p + (now - last) * sp / 1000.0f, 2.0f); last = now;
            float f = p - floorf(p);
            float on = (f < 0.15f || (f >= 0.3f && f < 0.45f)) ? 1.0f : 0.0f;
            float a = p < 1.0f ? on : 0.0f;
            float b = p < 1.0f ? 0.0f : on;
            auto call = id(fairy).turn_on();
            call.set_cold_white(a); call.set_warm_white(b);
            call.set_transition_length(0); call.set_publish(false); call.set_save(false);
            call.perform();

      # Two inverse sine waves: A = (1-cos)/2, B = (1+cos)/2. 1s per fade at 1x.
      # Gamma correction makes the *perceived* brightness follow the sine.
      - lambda:
          name: Crossfade
          update_interval: 30ms
          lambda: |-
            static float p = 0; static uint32_t last = 0;
            uint32_t now = millis(); if (now - last > 500) last = now;
            float sp = id(fx_speed).state; if (std::isnan(sp) || sp < 0.1f) sp = 1.0f;
            p = fmodf(p + (now - last) * sp / 1000.0f, 2.0f); last = now;
            float d = id(fade_depth).state / 100.0f; if (std::isnan(d)) d = 1.0f;
            float s = (1.0f - cosf(p * M_PI)) / 2.0f;
            auto call = id(fairy).turn_on();
            call.set_cold_white((1.0f - d) + d * s); call.set_warm_white((1.0f - d) + d * (1.0f - s));
            call.set_transition_length(0); call.set_publish(false); call.set_save(false);
            call.perform();

      # Both sets fade in and out together. 2s per fade.
      - lambda:
          name: Breathe
          update_interval: 30ms
          lambda: |-
            static float p = 0; static uint32_t last = 0;
            uint32_t now = millis(); if (now - last > 500) last = now;
            float sp = id(fx_speed).state; if (std::isnan(sp) || sp < 0.1f) sp = 1.0f;
            p = fmodf(p + (now - last) * sp / 2000.0f, 2.0f); last = now;
            float d = id(fade_depth).state / 100.0f; if (std::isnan(d)) d = 1.0f;
            float v = (1.0f - d) + d * (1.0f - cosf(p * M_PI)) / 2.0f;
            auto call = id(fairy).turn_on();
            call.set_cold_white(v); call.set_warm_white(v);
            call.set_transition_length(0); call.set_publish(false); call.set_save(false);
            call.perform();

      # Sine waves a quarter-cycle apart, so the sets overlap as they
      # rise and fall (stock "In Waves"). 2s per fade.
      - lambda:
          name: Waves
          update_interval: 30ms
          lambda: |-
            static float p = 0; static uint32_t last = 0;
            uint32_t now = millis(); if (now - last > 500) last = now;
            float sp = id(fx_speed).state; if (std::isnan(sp) || sp < 0.1f) sp = 1.0f;
            p = fmodf(p + (now - last) * sp / 2000.0f, 2.0f); last = now;
            float d = id(fade_depth).state / 100.0f; if (std::isnan(d)) d = 1.0f;
            float a = (1.0f - cosf(p * M_PI)) / 2.0f;
            float b = (1.0f - cosf(p * M_PI + M_PI / 2.0f)) / 2.0f;
            auto call = id(fairy).turn_on();
            call.set_cold_white((1.0f - d) + d * a); call.set_warm_white((1.0f - d) + d * b);
            call.set_transition_length(0); call.set_publish(false); call.set_save(false);
            call.perform();

      # One set at a time glows up and back down, never overlapping
      # (stock "Slo-Glo"). 1.5s per fade.
      - lambda:
          name: Slow Glow
          update_interval: 30ms
          lambda: |-
            static float p = 0; static uint32_t last = 0;
            uint32_t now = millis(); if (now - last > 500) last = now;
            float sp = id(fx_speed).state; if (std::isnan(sp) || sp < 0.1f) sp = 1.0f;
            p = fmodf(p + (now - last) * sp / 1500.0f, 4.0f); last = now;
            float d = id(fade_depth).state / 100.0f; if (std::isnan(d)) d = 1.0f;
            float s = (1.0f - cosf(fmodf(p, 2.0f) * M_PI)) / 2.0f;
            float a = p < 2.0f ? s : 0.0f;
            float b = p < 2.0f ? 0.0f : s;
            auto call = id(fairy).turn_on();
            call.set_cold_white((1.0f - d) + d * a); call.set_warm_white((1.0f - d) + d * b);
            call.set_transition_length(0); call.set_publish(false); call.set_save(false);
            call.perform();

      # Each set drifts smoothly to a new random brightness. 0.8s per drift.
      - lambda:
          name: Twinkle
          update_interval: 30ms
          lambda: |-
            static float p = 0; static uint32_t last = 0;
            static float pa = 1, pb = 1, ta = 1, tb = 1; static int last_step = -1;
            uint32_t now = millis(); if (now - last > 500) last = now;
            float sp = id(fx_speed).state; if (std::isnan(sp) || sp < 0.1f) sp = 1.0f;
            p = fmodf(p + (now - last) * sp / 800.0f, 1000.0f); last = now;
            float d = id(fade_depth).state / 100.0f; if (std::isnan(d)) d = 1.0f;
            int step = (int) p;
            if (step != last_step) {
              pa = ta; pb = tb;
              ta = (1.0f - d) + d * random_float();
              tb = (1.0f - d) + d * random_float();
              last_step = step;
            }
            float e = (1.0f - cosf((p - step) * M_PI)) / 2.0f;
            auto call = id(fairy).turn_on();
            call.set_cold_white(pa + (ta - pa) * e); call.set_warm_white(pb + (tb - pb) * e);
            call.set_transition_length(0); call.set_publish(false); call.set_save(false);
            call.perform();

number:
  # Multiplier on every effect's timing: 2.0x = twice as fast.
  - platform: template
    id: fx_speed
    name: Speed
    icon: mdi:speedometer
    unit_of_measurement: "x"
    min_value: 0.1
    max_value: 5
    step: 0.1
    initial_value: 1
    optimistic: true
    restore_value: true

  # 100% = fades go fully dark; lower = a gentler ripple that never
  # goes fully dark. Applies to the fading effects and Twinkle.
  - platform: template
    id: fade_depth
    name: Fade Depth
    icon: mdi:wave
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 120s
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Status
    entity_category: diagnostic
